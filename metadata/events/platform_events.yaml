# AutoFlow AI - Platform events (billing + AI)
#
# Domain event definitions (workflow, user, organization, connector,
# notification, system) live in their own domain files under
# metadata/events/. This file keeps the cross-cutting platform events.
# The Event Bus Generator merges every file in this directory.

events:
  billing:
    invoice.paid:
      description: Invoice payment received
      version: 1
      idempotent: true
    subscription.cancelled:
      description: Subscription cancelled
      version: 1
  ai:
    ai.workflow_generated:
      description: AI generated a new workflow
      version: 1
    ai.workflow_optimized:
      description: AI optimized an existing workflow
      version: 1
  connectors:
    connector.action_executed:
      description: Connector action executed (success or failure)
      version: 1
      payload:
        - connector
        - action
        - ok
        - duration_ms
    connector.trigger_fired:
      description: Connector trigger produced events
      version: 1
      payload:
        - connector
        - trigger
        - event_count
