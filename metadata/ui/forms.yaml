forms:
  workflow:
    fields:
      - name: name
        type: text
        required: true
        validation: required|max:255
      - name: description
        type: textarea
        required: false
      - name: status
        type: select
        options:
          - draft
          - active
          - paused
        required: true
      - name: config
        type: json_editor
        required: false
  user:
    fields:
      - name: email
        type: email
        required: true
      - name: full_name
        type: text
        required: true
      - name: password
        type: password
        required: true
