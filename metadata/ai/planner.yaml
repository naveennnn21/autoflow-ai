planner:
  models:
    workflow_analyzer:
      model: gpt-4
      description: Analyzes natural language to extract workflow intent
      temperature: 0.2
      output: WorkflowIntent
    step_decomposer:
      model: gpt-4-turbo
      description: Decomposes intent into executable steps
      temperature: 0.3
      output: StepList
    dependency_resolver:
      model: claude-3-sonnet
      description: Resolves step dependencies and ordering
      temperature: 0.1
  strategies:
    - top_down: Decompose goal into sub-goals
    - bottom_up: Compose known patterns into larger flow
    - example_based: Adapt from similar existing workflows
  constraints:
    max_steps: 50
    max_depth: 5
    timeout_seconds: 30
