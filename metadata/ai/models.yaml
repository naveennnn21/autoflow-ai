providers:
  openai:
    models:
      - gpt-4
      - gpt-4-turbo
      - gpt-3.5-turbo
    default: gpt-4
    max_tokens: 128000
  anthropic:
    models:
      - claude-3-opus
      - claude-3-sonnet
      - claude-3-haiku
    default: claude-3-sonnet
  google:
    models:
      - gemini-pro
      - gemini-ultra
    default: gemini-pro
  openrouter:
    models:
      - mistral-large
      - llama-3-70b
      - deepseek-coder
    default: mistral-large
