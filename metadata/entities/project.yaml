name: Project
table: projects
description: Project grouping for workflows
tenant: true
timestamps: true
soft_delete: true
uuid: true
fields:
  name:
    type: string
    nullable: false
  description:
    type: text
    nullable: true
  status:
    type: string
  # SQLAlchemy reserves `metadata` as a declarative attribute; expose it as
  # `extra_metadata` while preserving the DB column name `metadata`.
  extra_metadata:
    type: json
    column: metadata
relationships:
  organization:
    type: many_to_one
    target: Organization
  workflows:
    type: one_to_many
    target: Workflow
