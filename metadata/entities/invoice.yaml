name: Invoice
table: invoices
description: Billing invoice
tenant: true
timestamps: true
soft_delete: false
uuid: true
fields:
  amount:
    type: float
    nullable: false
  currency:
    type: string
  status:
    type: string
  description:
    type: text
    nullable: true
  paid_at:
    type: datetime
    nullable: true
  due_date:
    type: datetime
    nullable: true
  # SQLAlchemy reserves `metadata` as a declarative attribute; expose it as
  # `extra_metadata` while preserving the DB column name `metadata`.
  extra_metadata:
    type: json
    column: metadata
relationships:
  organization:
    type: many_to_one
    target: Organization
  subscription:
    type: many_to_one
    target: Subscription
