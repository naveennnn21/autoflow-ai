name: Slack
version: 1.0.0
description: Slack workspace messaging integration
category: chat
provider: slack
module_name: slack
authentication:
  type: oauth2
  provider: slack
  supported_scopes:
    - channels:read
    - chat:write
    - files:write
    - users:read
  auth_url: https://slack.com/oauth/v2/authorize
  token_url: https://slack.com/api/oauth.v2.access
  requires_refresh: false
  credential_fields:
    - client_id
    - client_secret
    - access_token
    - bot_token
actions:
  send_message:
    description: Post a message to a channel
    kind: create
    inputs:
      channel: string
      text: string
      thread_ts: string
      blocks: json
    outputs:
      message_ts: string
      channel_id: string
    required_permissions:
      - chat:write
    idempotent: true
  create_channel:
    description: Create a new channel
    kind: create
    inputs:
      name: string
      is_private: boolean
    outputs:
      channel_id: string
    required_permissions:
      - channels:manage
  list_channels:
    description: List channels in the workspace
    kind: list
    inputs:
      limit: integer
      cursor: string
    outputs:
      channels: list
    required_permissions:
      - channels:read
  upload_file:
    description: Upload a file to a channel
    kind: upload
    inputs:
      channels: list
      content: string
      filename: string
      filetype: string
    outputs:
      file_id: string
    required_permissions:
      - files:write
  lookup_user:
    description: Resolve a user by email
    kind: read
    inputs:
      email: string
    outputs:
      user_id: string
    required_permissions:
      - users:read
triggers:
  message_received:
    description: Triggered when a message is posted
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - slack.message_posted
  app_mention:
    description: Triggered when the bot is mentioned
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - slack.app_mentioned
rate_limits:
  default: 100/minute
  rules:
    send_message: 50/minute
    list_channels: 100/minute
retry_policy:
  max_attempts: 4
  base_delay: 1.0
  max_delay: 30.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: false
  default_interval_seconds: 60
webhooks:
  enabled: true
  events:
    - slack.message_posted
    - slack.app_mentioned
  secret_required: true
supported_events:
  - slack.message_posted
  - slack.app_mentioned
  - slack.channel_created
supported_objects:
  - channel
  - message
  - user
  - file
pagination:
  enabled: true
  default_page_size: 100
  max_page_size: 1000
  cursor_field: next_cursor
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: false
capabilities:
  actions: true
  triggers: true
  polling: false
  webhooks: true
  batching: false
  streaming: false
  pagination: true
  file_upload: true
  file_download: true
  long_running: false
permissions:
  read:
    - channels:read
    - users:read
  write:
    - chat:write
    - channels:manage
    - files:write
health_check:
  endpoint: https://slack.com/api/auth.test
  method: POST
  timeout_seconds: 10
documentation:
  url: https://api.slack.com
  setup_guide: Create a Slack app, add bot token scopes, and install it to your workspace.
  example_prompt: Post a daily digest to the #product channel
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
