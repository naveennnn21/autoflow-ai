name: GitHub
version: 1.0.0
description: GitHub repositories, issues, and pull requests
category: developer
provider: github
module_name: github
authentication:
  type: oauth2
  provider: github
  supported_scopes:
    - repo
    - read:org
    - workflow
  auth_url: https://github.com/login/oauth/authorize
  token_url: https://github.com/login/oauth/access_token
  requires_refresh: false
  credential_fields:
    - client_id
    - client_secret
    - access_token
actions:
  create_issue:
    description: Create an issue in a repository
    kind: create
    inputs:
      owner: string
      repo: string
      title: string
      body: text
      labels: list
    outputs:
      issue_number: integer
      issue_url: string
    required_permissions:
      - issues:write
    idempotent: false
  list_issues:
    description: List issues for a repository
    kind: list
    inputs:
      owner: string
      repo: string
      state: string
      per_page: integer
    outputs:
      issues: list
    required_permissions:
      - issues:read
  create_pull_request:
    description: Open a pull request
    kind: create
    inputs:
      owner: string
      repo: string
      title: string
      head: string
      base: string
      body: text
    outputs:
      pr_number: integer
      pr_url: string
    required_permissions:
      - pulls:write
    idempotent: false
  get_repository:
    description: Fetch repository metadata
    kind: read
    inputs:
      owner: string
      repo: string
    outputs:
      repository: object
    required_permissions:
      - repo
  list_commits:
    description: List commits on a branch
    kind: list
    inputs:
      owner: string
      repo: string
      branch: string
      per_page: integer
    outputs:
      commits: list
    required_permissions:
      - repo
triggers:
  push:
    description: Triggered on push events
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - github.push
  pull_request:
    description: Triggered on pull request events
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - github.pull_request
  issues:
    description: Triggered on issue events
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - github.issues
  workflow_run:
    description: Triggered when a workflow run completes
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - github.workflow_run
rate_limits:
  default: 5000/hour
  rules:
    list_issues: 60/minute
    create_issue: 60/minute
retry_policy:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 120
polling:
  enabled: false
  default_interval_seconds: 60
webhooks:
  enabled: true
  events:
    - github.push
    - github.pull_request
    - github.issues
    - github.workflow_run
  secret_required: true
supported_events:
  - github.push
  - github.pull_request
  - github.issues
  - github.workflow_run
supported_objects:
  - repository
  - issue
  - pull_request
  - commit
  - release
pagination:
  enabled: true
  default_page_size: 30
  max_page_size: 100
  cursor_field: page
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: false
capabilities:
  actions: true
  triggers: true
  polling: false
  webhooks: true
  batching: false
  streaming: false
  pagination: true
  file_upload: true
  file_download: true
  long_running: false
permissions:
  read:
    - repo
    - issues:read
  write:
    - issues:write
    - pulls:write
    - workflow
health_check:
  endpoint: https://api.github.com/rate_limit
  method: GET
  timeout_seconds: 10
documentation:
  url: https://docs.github.com/rest
  setup_guide: Create an OAuth App in GitHub developer settings and enable the required scopes.
  example_prompt: Create a GitHub issue for bug reports
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
