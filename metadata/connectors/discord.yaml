name: Discord
version: 1.0.0
description: Discord server messaging integration
category: chat
provider: discord
module_name: discord
authentication:
  type: bearer
  provider: discord
  supported_scopes:
    - bot
    - messages.read
  token_url: ""
  auth_url: ""
  requires_refresh: false
  credential_fields:
    - bot_token
actions:
  send_message:
    description: Send a message to a channel
    kind: create
    inputs:
      channel_id: string
      content: string
      embeds: json
      tts: boolean
    outputs:
      message_id: string
    required_permissions:
      - send_messages
    idempotent: true
  create_channel:
    description: Create a text channel
    kind: create
    inputs:
      guild_id: string
      name: string
      topic: string
    outputs:
      channel_id: string
    required_permissions:
      - manage_channels
  list_channels:
    description: List channels in a guild
    kind: list
    inputs:
      guild_id: string
    outputs:
      channels: list
    required_permissions:
      - view_channels
  get_guild_member:
    description: Fetch a guild member
    kind: read
    inputs:
      guild_id: string
      user_id: string
    outputs:
      member: object
    required_permissions:
      - view_members
  delete_message:
    description: Delete a message
    kind: delete
    inputs:
      channel_id: string
      message_id: string
    outputs:
      deleted: boolean
    required_permissions:
      - manage_messages
triggers:
  message_received:
    description: Triggered when a message is posted
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - discord.message_created
  member_joined:
    description: Triggered when a member joins
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - discord.member_joined
rate_limits:
  default: 50/second
  rules:
    send_message: 5/second
    list_channels: 10/second
retry_policy:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: false
  default_interval_seconds: 60
webhooks:
  enabled: true
  events:
    - discord.message_created
    - discord.member_joined
  secret_required: false
supported_events:
  - discord.message_created
  - discord.member_joined
supported_objects:
  - channel
  - message
  - member
  - guild
pagination:
  enabled: true
  default_page_size: 100
  max_page_size: 1000
  cursor_field: before
batching:
  enabled: false
  max_batch_size: 50
streaming:
  enabled: false
capabilities:
  actions: true
  triggers: true
  polling: false
  webhooks: true
  batching: false
  streaming: false
  pagination: true
  file_upload: true
  file_download: false
  long_running: false
permissions:
  read:
    - view_channels
    - view_members
  write:
    - send_messages
    - manage_channels
    - manage_messages
health_check:
  endpoint: https://discord.com/api/v10/users/@me
  method: GET
  timeout_seconds: 10
documentation:
  url: https://discord.com/developers/docs
  setup_guide: Create a bot application in the Discord developer portal and add it to your server.
  example_prompt: Announce releases in the #announcements channel
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
