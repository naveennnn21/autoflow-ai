name: Microsoft Teams
version: 1.0.0
description: Microsoft Teams messaging integration
category: chat
provider: microsoft
module_name: teams
authentication:
  type: oauth2
  provider: microsoft
  supported_scopes:
    - ChannelMessage.Send
    - Team.ReadBasic.All
    - User.Read
    - offline_access
  auth_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  requires_refresh: true
  credential_fields:
    - client_id
    - client_secret
    - access_token
    - refresh_token
actions:
  send_message:
    description: Send a message to a Teams channel
    kind: create
    inputs:
      team_id: string
      channel_id: string
      content: string
      content_type: string
    outputs:
      message_id: string
    required_permissions:
      - ChannelMessage.Send
    idempotent: true
  list_channels:
    description: List channels in a team
    kind: list
    inputs:
      team_id: string
    outputs:
      channels: list
    required_permissions:
      - Team.ReadBasic.All
  create_channel:
    description: Create a channel in a team
    kind: create
    inputs:
      team_id: string
      display_name: string
      description: string
    outputs:
      channel_id: string
    required_permissions:
      - Channel.Create
  list_teams:
    description: List teams the user belongs to
    kind: list
    inputs:
      top: integer
    outputs:
      teams: list
    required_permissions:
      - Team.ReadBasic.All
  get_message:
    description: Fetch a channel message
    kind: read
    inputs:
      team_id: string
      channel_id: string
      message_id: string
    outputs:
      message: object
    required_permissions:
      - ChannelMessage.Read.All
triggers:
  message_received:
    description: Triggered when a channel message is posted
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - teams.message_created
rate_limits:
  default: 300/minute
  rules:
    send_message: 100/minute
    list_channels: 200/minute
retry_policy:
  max_attempts: 3
  base_delay: 2.0
  max_delay: 120.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: true
  default_interval_seconds: 300
webhooks:
  enabled: false
  events:
    - teams.message_created
  secret_required: false
supported_events:
  - teams.message_created
supported_objects:
  - team
  - channel
  - message
pagination:
  enabled: true
  default_page_size: 50
  max_page_size: 999
  cursor_field: nextLink
batching:
  enabled: false
  max_batch_size: 50
streaming:
  enabled: false
capabilities:
  actions: true
  triggers: true
  polling: true
  webhooks: false
  batching: false
  streaming: false
  pagination: true
  file_upload: true
  file_download: true
  long_running: false
permissions:
  read:
    - Team.ReadBasic.All
    - ChannelMessage.Read.All
  write:
    - ChannelMessage.Send
    - Channel.Create
health_check:
  endpoint: https://graph.microsoft.com/v1.0/me
  method: GET
  timeout_seconds: 10
documentation:
  url: https://learn.microsoft.com/graph/teams-concept-overview
  setup_guide: Register an Azure app with Microsoft Graph Teams permissions and an OAuth flow.
  example_prompt: Post sprint updates to the engineering channel
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
