name: OneDrive
version: 1.0.0
description: Microsoft OneDrive file storage integration
category: storage
provider: microsoft
module_name: onedrive
authentication:
  type: oauth2
  provider: microsoft
  supported_scopes:
    - Files.ReadWrite.All
    - User.Read
    - offline_access
  auth_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
  token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
  requires_refresh: true
  credential_fields:
    - client_id
    - client_secret
    - access_token
    - refresh_token
actions:
  upload_file:
    description: Upload a file to OneDrive
    kind: upload
    inputs:
      path: string
      content: string
      conflict_behavior: string
    outputs:
      file_id: string
      download_url: string
    required_permissions:
      - Files.ReadWrite.All
    idempotent: false
  download_file:
    description: Download a file from OneDrive
    kind: download
    inputs:
      path: string
    outputs:
      content: string
    required_permissions:
      - Files.ReadWrite.All
  list_files:
    description: List files in a folder
    kind: list
    inputs:
      path: string
      top: integer
    outputs:
      entries: list
    required_permissions:
      - Files.Read.All
  create_folder:
    description: Create a folder
    kind: create
    inputs:
      path: string
      name: string
    outputs:
      folder_id: string
    required_permissions:
      - Files.ReadWrite.All
  search_files:
    description: Search OneDrive for files
    kind: search
    inputs:
      query: string
      top: integer
    outputs:
      matches: list
    required_permissions:
      - Files.Read.All
  delete_file:
    description: Delete a file or folder
    kind: delete
    inputs:
      path: string
    outputs:
      deleted: boolean
    required_permissions:
      - Files.ReadWrite.All
triggers:
  file_created:
    description: Triggered when a file is created
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - onedrive.file_created
  file_modified:
    description: Triggered when a file is modified
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - onedrive.file_modified
rate_limits:
  default: 1000/hour
  rules:
    download_file: 100/minute
    upload_file: 100/minute
retry_policy:
  max_attempts: 3
  base_delay: 2.0
  max_delay: 120.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 60
  write: 60
  execute: 120
polling:
  enabled: true
  default_interval_seconds: 300
webhooks:
  enabled: false
  events:
    - onedrive.file_created
  secret_required: false
supported_events:
  - onedrive.file_created
  - onedrive.file_modified
supported_objects:
  - file
  - folder
pagination:
  enabled: true
  default_page_size: 50
  max_page_size: 999
  cursor_field: nextLink
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: true
capabilities:
  actions: true
  triggers: true
  polling: true
  webhooks: false
  batching: false
  streaming: true
  pagination: true
  file_upload: true
  file_download: true
  long_running: true
permissions:
  read:
    - Files.Read.All
  write:
    - Files.ReadWrite.All
health_check:
  endpoint: https://graph.microsoft.com/v1.0/me/drive
  method: GET
  timeout_seconds: 10
documentation:
  url: https://learn.microsoft.com/graph/onedrive-concept-overview
  setup_guide: Register an Azure app with Files.ReadWrite.All and an OAuth flow.
  example_prompt: Save meeting recordings to OneDrive
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
