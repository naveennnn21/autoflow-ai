name: REST
version: 1.0.0
description: Generic REST API connector for any HTTP endpoint
category: generic
provider: http
module_name: rest
authentication:
  type: none
  provider: http
  supported_scopes:
    - read
    - write
  auth_url: ""
  token_url: ""
  requires_refresh: false
  credential_fields:
    - base_url
    - headers
    - api_key
    - bearer_token
actions:
  get:
    description: Perform an HTTP GET request
    kind: read
    inputs:
      path: string
      query: json
      headers: json
    outputs:
      status_code: integer
      body: json
      headers: json
    required_permissions:
      - read
    idempotent: true
  post:
    description: Perform an HTTP POST request
    kind: create
    inputs:
      path: string
      body: json
      headers: json
    outputs:
      status_code: integer
      body: json
    required_permissions:
      - write
    idempotent: false
  put:
    description: Perform an HTTP PUT request
    kind: update
    inputs:
      path: string
      body: json
      headers: json
    outputs:
      status_code: integer
      body: json
    required_permissions:
      - write
    idempotent: true
  patch:
    description: Perform an HTTP PATCH request
    kind: update
    inputs:
      path: string
      body: json
      headers: json
    outputs:
      status_code: integer
      body: json
    required_permissions:
      - write
    idempotent: false
  delete:
    description: Perform an HTTP DELETE request
    kind: delete
    inputs:
      path: string
      headers: json
    outputs:
      status_code: integer
      body: json
    required_permissions:
      - write
    idempotent: true
triggers:
  webhook_received:
    description: Triggered when the endpoint receives a webhook
    kind: webhook
    webhook: true
    polling_interval_seconds: 0
    supported_events:
      - rest.webhook_received
  manual:
    description: Manual trigger
    kind: manual
    webhook: false
    polling_interval_seconds: 0
    supported_events: []
rate_limits:
  default: 60/minute
  rules:
    get: 120/minute
    post: 60/minute
retry_policy:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: false
  default_interval_seconds: 60
webhooks:
  enabled: true
  events:
    - rest.webhook_received
  secret_required: false
supported_events:
  - rest.webhook_received
supported_objects:
  - resource
pagination:
  enabled: true
  default_page_size: 50
  max_page_size: 1000
  cursor_field: page
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: true
capabilities:
  actions: true
  triggers: true
  polling: false
  webhooks: true
  batching: false
  streaming: true
  pagination: true
  file_upload: true
  file_download: true
  long_running: true
permissions:
  read:
    - read
  write:
    - write
health_check:
  endpoint: ""
  method: GET
  timeout_seconds: 10
documentation:
  url: ""
  setup_guide: Configure the base URL and authentication to call any REST API.
  example_prompt: Call an internal REST API to fetch data
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
