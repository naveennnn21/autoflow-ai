name: Google Drive
version: 1.0.0
description: Google Drive file storage integration
category: storage
provider: google
module_name: google_drive
authentication:
  type: oauth2
  provider: google
  supported_scopes:
    - https://www.googleapis.com/auth/drive.file
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/drive.appdata
  auth_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  requires_refresh: true
  credential_fields:
    - client_id
    - client_secret
    - access_token
    - refresh_token
actions:
  upload_file:
    description: Upload a file to Drive
    kind: upload
    inputs:
      name: string
      content: string
      mime_type: string
      parent_folder_id: string
    outputs:
      file_id: string
      web_view_link: string
    required_permissions:
      - drive.file
    idempotent: false
  download_file:
    description: Download a file from Drive
    kind: download
    inputs:
      file_id: string
      mime_type: string
    outputs:
      content: string
      content_type: string
    required_permissions:
      - drive.readonly
  list_files:
    description: List files in a folder
    kind: list
    inputs:
      folder_id: string
      page_size: integer
      query: string
    outputs:
      files: list
      next_page_token: string
    required_permissions:
      - drive.readonly
  create_folder:
    description: Create a Drive folder
    kind: create
    inputs:
      name: string
      parent_folder_id: string
    outputs:
      folder_id: string
    required_permissions:
      - drive.file
  search_files:
    description: Search Drive for files
    kind: search
    inputs:
      query: string
      page_size: integer
    outputs:
      files: list
    required_permissions:
      - drive.readonly
  delete_file:
    description: Delete a file
    kind: delete
    inputs:
      file_id: string
    outputs:
      deleted: boolean
    required_permissions:
      - drive.file
triggers:
  file_created:
    description: Triggered when a file is created
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - google_drive.file_created
  file_modified:
    description: Triggered when a file is modified
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - google_drive.file_modified
rate_limits:
  default: 300/minute
  rules:
    download_file: 120/minute
    upload_file: 60/minute
retry_policy:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 60
  write: 60
  execute: 120
polling:
  enabled: true
  default_interval_seconds: 300
webhooks:
  enabled: false
  events:
    - google_drive.file_created
  secret_required: false
supported_events:
  - google_drive.file_created
  - google_drive.file_modified
supported_objects:
  - file
  - folder
pagination:
  enabled: true
  default_page_size: 100
  max_page_size: 1000
  cursor_field: nextPageToken
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: true
capabilities:
  actions: true
  triggers: true
  polling: true
  webhooks: false
  batching: false
  streaming: true
  pagination: true
  file_upload: true
  file_download: true
  long_running: true
permissions:
  read:
    - drive.readonly
  write:
    - drive.file
    - drive.appdata
health_check:
  endpoint: https://www.googleapis.com/drive/v3/about
  method: GET
  timeout_seconds: 10
documentation:
  url: https://developers.google.com/drive/api
  setup_guide: Enable the Drive API in Google Cloud and add OAuth client credentials.
  example_prompt: Save the generated report to Google Drive
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
