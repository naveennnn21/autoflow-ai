name: Gmail
version: 1.0.0
description: Google Gmail email integration
category: email
provider: google
module_name: gmail
authentication:
  type: oauth2
  provider: google
  supported_scopes:
    - https://www.googleapis.com/auth/gmail.send
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.modify
  auth_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  requires_refresh: true
  credential_fields:
    - client_id
    - client_secret
    - access_token
    - refresh_token
actions:
  send_email:
    description: Send an email message
    kind: create
    inputs:
      to: string
      cc: string
      bcc: string
      subject: string
      body: text
      thread_id: string
    outputs:
      message_id: string
      thread_id: string
    required_permissions:
      - gmail.send
    idempotent: true
  search_emails:
    description: Search emails by query
    kind: search
    inputs:
      query: string
      max_results: integer
    outputs:
      messages: list
    required_permissions:
      - gmail.readonly
  create_draft:
    description: Create an email draft
    kind: create
    inputs:
      to: string
      subject: string
      body: text
    outputs:
      draft_id: string
    required_permissions:
      - gmail.compose
  get_email:
    description: Fetch a single email by id
    kind: read
    inputs:
      message_id: string
      format: string
    outputs:
      email: object
    required_permissions:
      - gmail.readonly
  modify_labels:
    description: Add or remove labels on a message
    kind: update
    inputs:
      message_id: string
      add_label_ids: list
      remove_label_ids: list
    outputs:
      labels: list
    required_permissions:
      - gmail.modify
triggers:
  new_email:
    description: Triggered when a new email arrives
    kind: polling
    webhook: false
    polling_interval_seconds: 60
    supported_events:
      - email.received
  email_label:
    description: Triggered when an email is labeled
    kind: polling
    webhook: false
    polling_interval_seconds: 60
    supported_events:
      - email.labeled
rate_limits:
  default: 250/hour
  rules:
    send_email: 100/hour
    search_emails: 500/hour
retry_policy:
  max_attempts: 3
  base_delay: 1.0
  max_delay: 60.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: true
  default_interval_seconds: 60
webhooks:
  enabled: false
  events:
    - email.received
  secret_required: false
supported_events:
  - email.received
  - email.sent
  - email.labeled
supported_objects:
  - email
  - draft
  - label
pagination:
  enabled: true
  default_page_size: 50
  max_page_size: 500
  cursor_field: nextPageToken
batching:
  enabled: false
  max_batch_size: 100
streaming:
  enabled: false
capabilities:
  actions: true
  triggers: true
  polling: true
  webhooks: false
  batching: false
  streaming: false
  pagination: true
  file_upload: true
  file_download: true
  long_running: false
permissions:
  read:
    - gmail.readonly
  write:
    - gmail.send
    - gmail.modify
    - gmail.compose
health_check:
  endpoint: https://gmail.googleapis.com/gmail/v1/users/me/profile
  method: GET
  timeout_seconds: 10
documentation:
  url: https://developers.google.com/gmail/api
  setup_guide: Create a Google Cloud project, enable the Gmail API, and add OAuth client credentials.
  example_prompt: Send a welcome email to a new signup
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - requests
