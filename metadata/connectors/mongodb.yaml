name: MongoDB
version: 1.0.0
description: MongoDB document database connector
category: database
provider: mongodb
module_name: mongodb
authentication:
  type: basic
  provider: mongodb
  supported_scopes:
    - read
    - write
  auth_url: ""
  token_url: ""
  requires_refresh: false
  credential_fields:
    - uri
    - database
    - username
    - password
actions:
  find_documents:
    description: Query documents in a collection
    kind: read
    inputs:
      collection: string
      filter: json
      limit: integer
      sort: json
    outputs:
      documents: list
      count: integer
    required_permissions:
      - read
    idempotent: true
  insert_documents:
    description: Insert documents into a collection
    kind: create
    inputs:
      collection: string
      documents: json
    outputs:
      inserted_ids: list
    required_permissions:
      - write
    idempotent: false
  update_documents:
    description: Update documents matching a filter
    kind: update
    inputs:
      collection: string
      filter: json
      update: json
      upsert: boolean
      multi: boolean
    outputs:
      modified_count: integer
    required_permissions:
      - write
    idempotent: false
  delete_documents:
    description: Delete documents matching a filter
    kind: delete
    inputs:
      collection: string
      filter: json
    outputs:
      deleted_count: integer
    required_permissions:
      - write
    idempotent: false
  aggregate:
    description: Run an aggregation pipeline
    kind: run
    inputs:
      collection: string
      pipeline: json
    outputs:
      results: list
    required_permissions:
      - read
    idempotent: true
triggers:
  document_inserted:
    description: Triggered when a document is inserted
    kind: polling
    webhook: false
    polling_interval_seconds: 300
    supported_events:
      - mongodb.document_inserted
rate_limits:
  default: 600/minute
  rules:
    find_documents: 120/minute
    insert_documents: 120/minute
retry_policy:
  max_attempts: 2
  base_delay: 1.0
  max_delay: 30.0
  backoff_factor: 2.0
timeouts:
  connect: 10
  read: 30
  write: 30
  execute: 60
polling:
  enabled: true
  default_interval_seconds: 300
webhooks:
  enabled: false
  events: []
  secret_required: false
supported_events:
  - mongodb.document_inserted
supported_objects:
  - collection
  - document
pagination:
  enabled: true
  default_page_size: 100
  max_page_size: 1000
  cursor_field: skip
batching:
  enabled: true
  max_batch_size: 1000
streaming:
  enabled: true
capabilities:
  actions: true
  triggers: true
  polling: true
  webhooks: false
  batching: true
  streaming: true
  pagination: true
  file_upload: false
  file_download: false
  long_running: true
permissions:
  read:
    - read
  write:
    - write
health_check:
  endpoint: ""
  method: CONNECT
  timeout_seconds: 10
documentation:
  url: https://www.mongodb.com/docs
  setup_guide: Provide a MongoDB connection URI, database name, and optional credentials.
  example_prompt: Find all users created in the last week
deprecation_policy:
  deprecated: false
  sunset_date: null
  recommended_version: "1.0.0"
dependencies:
  - pymongo
