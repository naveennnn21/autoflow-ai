# AutoFlow AI - Production Docker Compose
# 
# Usage:
#   1. Copy .env.example to .env and configure production values
#   2. Generate a secure secret key: python -c "import secrets; print(secrets.token_urlsafe(64))"
#   3. Run: docker compose -f docker-compose.production.yml up -d
#
# This configuration includes:
# - Caddy edge: the ONLY service that publishes host ports (80/443), terminating
#   TLS (automatic ACME for a public SITE_ADDRESS, internal CA for localhost)
# - PostgreSQL 16 with persistent storage (private network only)
# - Redis 7 for caching and Celery broker (private network only)
# - FastAPI backend with Uvicorn workers (private network only)
# - Next.js frontend (production build, private network only)
# - Celery worker for background jobs
# - Backup scheduler + off-host upload
# - Health checks for all services
# - Resource limits for production
#
# Network model (see docs/EDGE_TLS_OPERATIONS.md):
#   edge      - public-facing: caddy, backend, celery-worker, frontend, backup.
#               Only caddy publishes host ports. Fixed subnet so the backend
#               can trust exactly this network's addresses as proxies.
#   autoflow  - internal: postgres, redis, backend, celery-worker, backup.
#               Marked `internal: true`, so it has no route off the host and
#               the datastores/broker are never reachable from outside.

services:
  # --- Edge: TLS termination + reverse proxy ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Public hostname enables automatic HTTPS (ACME). "localhost" uses
      # Caddy's internal CA, which is what local validation uses.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./infra/docker/caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      # TLS must actually be served on 443 for the edge to be usable.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - edge

  # --- Database ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
    # No host port: reachable on the internal network only.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - autoflow

  # --- Cache & Message Broker ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-autoflow_redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    # No host port: reachable on the internal network only.
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-autoflow_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - autoflow

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # The image CMD is repeated here only to add the proxy flags. uvicorn may
    # trust X-Forwarded-For from the edge network (CIDRs); with the safe
    # default it trusts nothing and app.core.client_ip does the work.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips",
              "${TRUSTED_PROXY_CIDRS:-127.0.0.1}"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://yourdomain.com"]}
      # Only these peers may set X-Forwarded-For (the edge network). Must stay
      # in sync with the `edge` subnet below.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.0.0/24}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    # No host port: the backend is reachable through the edge only.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness (not liveness): fails if PostgreSQL is unreachable, so a
      # broken DB connection can never be reported as "healthy".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readiness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - autoflow
      - edge

  # --- Celery Worker (Background Jobs) ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=${LOG_LEVEL:-INFO} --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autoflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-autoflow_redis_secret}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks", "inspect", "ping", "--timeout=10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - autoflow
      - edge

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://yourdomain.com/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://yourdomain.com}
    restart: unless-stopped
    # No host port: the frontend is served through the edge only.
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - edge

  # --- Backup scheduler + off-host upload ---
  # Runs infra/docker/backup.sh (the Step 1 tested path) on a schedule,
  # uploads the verified dump to S3-compatible storage and alerts on failure.
  # Off-host requirements are OFF unless BACKUP_REMOTE_ENABLED=true.
  backup:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
      BACKUP_DIR: /backups
      BACKUP_PG_MODE: direct
      PGHOST: postgres
      PGPORT: "5432"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Off-host storage (S3-compatible). Secrets come from .env only.
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE_ENABLED:-false}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-auto}
      BACKUP_REMOTE_ALLOW_OVERWRITE: ${BACKUP_REMOTE_ALLOW_OVERWRITE:-false}
      # Require https:// for the S3 endpoint and alert webhook. The escape
      # hatch is for local testing only and must remain false in production.
      BACKUP_ALLOW_INSECURE_ENDPOINTS: ${BACKUP_ALLOW_INSECURE_ENDPOINTS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      # Failure alerting
      BACKUP_ALERT_ENABLED: ${BACKUP_ALERT_ENABLED:-false}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
      BACKUP_ALERT_TIMEOUT_SECONDS: ${BACKUP_ALERT_TIMEOUT_SECONDS:-10}
      # Retry
      BACKUP_RETRY_ATTEMPTS: ${BACKUP_RETRY_ATTEMPTS:-3}
      BACKUP_RETRY_DELAY_SECONDS: ${BACKUP_RETRY_DELAY_SECONDS:-30}
      BACKUP_RETRY_MAX_DELAY_SECONDS: ${BACKUP_RETRY_MAX_DELAY_SECONDS:-300}
      # Scheduling
      BACKUP_SCHEDULE_INTERVAL_SECONDS: ${BACKUP_SCHEDULE_INTERVAL_SECONDS:-86400}
      BACKUP_SCHEDULE_JITTER_SECONDS: ${BACKUP_SCHEDULE_JITTER_SECONDS:-0}
      BACKUP_SCHEDULE_RUN_ON_START: ${BACKUP_SCHEDULE_RUN_ON_START:-true}
    volumes:
      - ${BACKUP_HOST_DIR:-./infra/backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The scheduler heartbeat file must be recent; a dead scheduler is visible.
      test: ["CMD-SHELL", "test -f /backups/.scheduler_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /backups/.scheduler_heartbeat) )) -le ${BACKUP_HEARTBEAT_MAX_AGE_SECONDS:-129600} ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - autoflow
      - edge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddydata:
    driver: local
  caddyconfig:
    driver: local

networks:
  # Internal: no route off the host. Datastores and the broker live here and
  # are never published to the host.
  autoflow:
    driver: bridge
    internal: true
  # Edge: public-facing services. The fixed subnet makes the trusted-proxy
  # allowlist (TRUSTED_PROXY_CIDRS) deterministic. If you change it, update
  # TRUSTED_PROXY_CIDRS to match.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.0.0/24}
