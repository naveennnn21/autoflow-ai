name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Metadata validation
        run: |
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, ".")
          from scripts.generators.common.metadata_loader import MetadataLoader
          from scripts.generators.common.metadata_validator import MetadataValidator
          model = MetadataLoader("metadata").load_all()
          validator = MetadataValidator(model)
          validator.validate_all()
          if validator.errors:
              print("\n".join(validator.errors))
              raise SystemExit(1)
          print("metadata validation OK")
          PYEOF
      - name: Backend tests
        run: python -m pytest -q
      - name: Event bus validation
        run: python scripts/validate_events.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Production build
        run: npm run build
