# Local-only override: run AutoFlow on alternate host ports.
#   docker compose up -d --build
# Backend API: http://localhost:8001/api/v1  (docs at /docs)
# Frontend:    http://localhost:3001
# (Internal service-to-service URLs are unchanged.)
services:
  postgres:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  backend:
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
    ports:
      - "3001:3000"
